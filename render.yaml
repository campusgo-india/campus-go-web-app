# Render Blueprint for the CampusGo API (NestJS).
# Deploy: Render Dashboard → New → Blueprint → pick this repo.
# Free plan (sleeps after ~15 min idle). DATABASE_URL + WEB_ORIGIN are set in the
# dashboard (sync:false); the JWT secrets are generated for you.
services:
  # Keeps campusgo-api awake by hitting its health check every 5 minutes — the
  # free web service above sleeps after ~15 min idle, and the first request
  # after that has to cold-start it (tens of seconds), during which Render's
  # own edge throttles retries with a 429 that looks like a login/rate-limit
  # bug but isn't. NOTE: Render Cron Jobs are not on the free tier the way the
  # web service is — each run bills a few seconds of compute on whichever
  # instance size you pick when you sync this Blueprint. Check current Render
  # pricing before enabling. A zero-cost alternative: point a free external
  # uptime pinger (UptimeRobot, cron-job.org, etc.) at
  # https://campus-go-web-app.onrender.com/api/v1/health every 5-10 minutes
  # instead of using this cron job.
  - type: cron
    name: campusgo-api-keepalive
    runtime: node
    plan: starter
    region: singapore
    schedule: "*/5 * * * *"
    buildCommand: "true"
    startCommand: curl -sf https://campus-go-web-app.onrender.com/api/v1/health
  - type: web
    name: campusgo-api
    runtime: node
    plan: free
    region: singapore # pick the Render region closest to your Supabase project
    autoDeploy: true
    # Render already provides pnpm (detected from packageManager); no corepack.
    # Install with NODE_ENV=development so devDependencies (prisma, nest CLI) are
    # installed for the build — they're skipped under NODE_ENV=production.
    buildCommand: NODE_ENV=development pnpm install --frozen-lockfile && pnpm --filter @campusgo/database generate && pnpm --filter @campusgo/api build
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "20" # pin to LTS — newer Node can break native modules (bcrypt)
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      # Render injects PORT automatically; the API already reads it.
      - key: JWT_ACCESS_SECRET
        generateValue: true # Render generates a strong random value
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false # paste the Supabase Postgres connection string in the dashboard
      - key: WEB_ORIGIN
        sync: false # set to your Vercel URL, e.g. https://campus-go-web-app.vercel.app
      # Outbound notification email (see docs/email-integration-checklist.md).
      # Reuse the SAME EMAIL_CREDENTIALS_KEY as your local .env — generating a
      # different one here makes any already-encrypted college SMTP passwords
      # in the database undecryptable.
      - key: EMAIL_CREDENTIALS_KEY
        sync: false
      # Platform default sender — tried first. DEFAULT_FROM_EMAIL must be on a
      # domain verified in the Resend dashboard.
      - key: RESEND_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: DEFAULT_FROM_NAME
        sync: false
      # Legacy fallback-of-last-resort (GoDaddy SMTP), only read if
      # RESEND_API_KEY above is unset.
      - key: DEFAULT_SMTP_HOST
        sync: false
      - key: DEFAULT_SMTP_PORT
        sync: false
      - key: DEFAULT_SMTP_SECURE
        sync: false
      - key: DEFAULT_SMTP_USER
        sync: false
      - key: DEFAULT_SMTP_PASSWORD
        sync: false
