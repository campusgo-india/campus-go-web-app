# Render Blueprint for the CampusGO API (NestJS).
# Deploy: Render Dashboard → New → Blueprint → pick this repo.
# Free plan (sleeps after ~15 min idle). DATABASE_URL + WEB_ORIGIN are set in the
# dashboard (sync:false); the JWT secrets are generated for you.
services:
  - type: web
    name: campusgo-api
    runtime: node
    plan: free
    region: singapore # pick the Render region closest to your Supabase project
    autoDeploy: true
    # Render already provides pnpm (detected from packageManager); no corepack.
    # Install with NODE_ENV=development so devDependencies (prisma, nest CLI) are
    # installed for the build — they're skipped under NODE_ENV=production.
    buildCommand: NODE_ENV=development pnpm install --frozen-lockfile && pnpm --filter @campusgo/database generate && pnpm --filter @campusgo/api build
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "20" # pin to LTS — newer Node can break native modules (bcrypt)
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      # Render injects PORT automatically; the API already reads it.
      - key: JWT_ACCESS_SECRET
        generateValue: true # Render generates a strong random value
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false # paste the Supabase Postgres connection string in the dashboard
      - key: WEB_ORIGIN
        sync: false # set to your Vercel URL, e.g. https://campus-go-web-app.vercel.app
      # Outbound notification email (see docs/email-integration-checklist.md).
      # Reuse the SAME EMAIL_CREDENTIALS_KEY as your local .env — generating a
      # different one here makes any already-encrypted college SMTP passwords
      # in the database undecryptable.
      - key: EMAIL_CREDENTIALS_KEY
        sync: false
      - key: DEFAULT_SMTP_HOST
        sync: false
      - key: DEFAULT_SMTP_PORT
        sync: false
      - key: DEFAULT_SMTP_SECURE
        sync: false
      - key: DEFAULT_SMTP_USER
        sync: false
      - key: DEFAULT_SMTP_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: DEFAULT_FROM_NAME
        sync: false
